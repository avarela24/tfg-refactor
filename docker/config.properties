# Generado a partir de config.template.properties, con rutas ajustadas al
# layout del contenedor (ver docker/Dockerfile y docker/entrypoint.sh).
# Constants.java lo busca en el CWD del proceso Java (System.getProperty("user.dir")),
# por eso el WORKDIR del runtime stage es /config.

output.folder=/config/output/
complexity.threshold=15

# NOTA: a día de hoy working.memory y time.limit se leen pero no se aplican
# (Constants.java descarta el resultado de Integer.parseInt en ambos casos).
# El límite de memoria real se controla con el -Xmx del entrypoint.
working.memory=2048
time.limit=300

cplex.native.library.path=/opt/cplex/bin/x86-64_linux
