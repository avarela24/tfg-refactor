# Fragmento para incorporar a vuestro docker-compose.yml general (junto a
# los servicios de n8n y del MCP server en Spring Boot). Este contenedor no
# es un servicio "always on": se piensa como una tarea bajo demanda que el
# MCP server dispara (docker run / docker compose run) por cada análisis.

services:
  eclipse-runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./workspace:/workspace   # proyecto(s) Java ya importados como proyecto Eclipse
      - ./output:/config/output  # aquí caen los CSV de resultados
    # Ejemplo de invocación puntual:
    #   docker compose run --rm eclipse-runner MiProyecto ES-LSF false
